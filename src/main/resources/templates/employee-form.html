<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Employees List</title>
</head>
<body>
<div class="container">
    <h3>Employee Directory</h3>
    <hr>
    <p class="h4 mb-4">Save Employee</p>
    <form th:action="@{/employees/saveEmployee}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}">
        <input type="text" th:field="*{firstName}" class="form-control mb-3 w-25" placeholder="First Name">
        <input type="text" th:field="*{lastName}" class="form-control mb-3 w-25" placeholder="Last Name">
        <input type="text" th:field="*{email}" class="form-control mb-3 w-25" placeholder="Email">
        <button type="submit" class="btn btn-primary btn-sm mb-3">Save</button>
        <a th:href="@{/employees}" class="btn btn-secondary btn-sm mb-3">Cancel</a>
    </form>
</div>
</body>
</html>
